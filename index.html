<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe4">
<title>观象 · 周易占卜</title>
<meta name="description" content="周易占卜：三钱、摇签、蓍草三档筮法。纯静态，静心问易。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='92' fill='%23f4efe4'/%3E%3Cpath d='M100 38a62 62 0 1 1-44 106' fill='none' stroke='%231e1a15' stroke-width='18' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="ink-fill" cx="42%" cy="36%" r="64%">
      <stop offset="0%"  stop-color="#211e19" stop-opacity=".95"/>
      <stop offset="42%" stop-color="#38332b" stop-opacity=".82"/>
      <stop offset="70%" stop-color="#6d665a" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#98917f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ink-wash" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#2a2620" stop-opacity=".16"/>
      <stop offset="70%" stop-color="#2a2620" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#2a2620" stop-opacity="0"/>
    </radialGradient>
    <filter id="ink-edge" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="enso-edge" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="4" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".5"/>
    </filter>
    <filter id="ink-edge-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="grain" aria-hidden="true"></div>
<div class="wash" aria-hidden="true"></div>

<main id="app" class="app">
  <p class="loading">载入卦象…</p>
</main>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
